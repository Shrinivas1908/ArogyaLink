events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend_api {
        server backend:8000;
    }

    upstream kiosk_app {
        server patient-kiosk:80;
    }

    upstream doctor_app {
        server doctor-dashboard:80;
    }

    upstream portal_app {
        server portal:80;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. FastAPI REST Backend
        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. WebSockets for Real-Time Doctor Notifications & Queue
        location /ws/ {
            proxy_pass http://backend_api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Patient Kiosk UI (mapped to /kiosk/)
        location /kiosk/ {
            proxy_pass http://kiosk_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /kiosk {
            return 301 /kiosk/;
        }

        # 4. Doctor Dashboard UI (mapped to /doctor/)
        location /doctor/ {
            proxy_pass http://doctor_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /doctor {
            return 301 /doctor/;
        }

        # 5. Main Patient & Public Health Portal (Root /)
        location / {
            proxy_pass http://portal_app;
            proxy_set_header Host $host;
        }
    }
}
