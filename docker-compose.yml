services:
  db:
    image: postgres:16-alpine
    container_name: arogya_link_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arogya
      POSTGRES_PASSWORD: arogya_pass
      POSTGRES_DB: arogya_link
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogya -d arogya_link"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
