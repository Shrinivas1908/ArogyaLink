services:
  # ── 1. FastAPI Backend Web Service ────────────────────────────────────
  - type: web
    name: arogyasetu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arogyasetu-postgres
          property: connectionString
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_ENABLED
        value: "true"

databases:
  # ── 2. Managed PostgreSQL Database ────────────────────────────────────
  - name: arogyasetu-postgres
    plan: free
    region: oregon
    databaseName: arogya_setu
    user: arogya_user
